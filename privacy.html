<style>:root{--bg:#FAF3DF;--surface:#FFFCF3;--fg:#241F18;--muted:#574D3E;--line:#D8C8A2;--accent:#4E5A33;color-scheme:light}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 "Figtree","Segoe UI",system-ui,-apple-system,sans-serif}main{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 24px) 16px 40px;display:grid;gap:14px}header{display:flex;align-items:center;gap:12px}header svg{width:48px;height:48px;border-radius:12px;flex:none}h1{font-family:"Literata",Georgia,serif;font-weight:600;font-size:clamp(26px,7vw,32px);line-height:1.15;margin:0}h3{margin:0;font-size:17px}.card{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:10px}.note{margin:0;color:var(--muted);font-size:15px}.steps{margin:0;padding-left:22px;display:grid;gap:8px}.steps li{font-size:15px}.steps li::marker{color:var(--accent);font-weight:700}a.open{display:inline-flex;justify-content:center;align-items:center;min-height:48px;border-radius:14px;background:var(--accent);color:#FFFBF3;font-weight:700;text-decoration:none;padding:0 20px}[hidden]{display:none!important}</style>
<script src="config.js"></script>

<script>/* src/i18n.js */
/* Shepherd languages. The app is written in English; this swaps each piece of text on screen for the chosen language
   as it appears. Bible verses (marked data-noi18n) always stay in English (NIV). Names and notes people type are left
   alone because they are not in the dictionary. */
(function () {
  var LANGS = [
    ['en', 'English', 'en-GB'], ['es', 'Español', 'es'], ['fr', 'Français', 'fr'], ['pt', 'Português', 'pt'],
    ['nl', 'Nederlands', 'nl'], ['pl', 'Polski', 'pl'], ['pcm', 'Naijá', 'en-NG'], ['yo', 'Yorùbá', 'yo'],
    ['ig', 'Igbo', 'ig'], ['zh-Hans', '中文（简体）', 'zh-CN'], ['zh-Hant', '中文（繁體・香港／台灣）', 'zh-TW'],
    ['ja', '日本語', 'ja'], ['de', 'Deutsch', 'de'], ['ru', 'Русский', 'ru'], ['lt', 'Lietuvių', 'lt']
  ];
  var CODES = LANGS.map(function (l) { return l[0]; });
  var PACK_VER = '0bacd4d9c1';
  var lang = 'en', dict = null, tpls = [], cache = new Map(), outs = new WeakMap(), plural = null;
  var collect = typeof window !== 'undefined' && window.__i18nCollect ? window.__i18nCollect : null;
  var INLINE = { B: 1, STRONG: 1, I: 1, EM: 1, BR: 1, U: 1, SMALL: 1, CODE: 1 };
  var SKIP = { SCRIPT: 1, STYLE: 1, TEXTAREA: 1, svg: 1, SVG: 1, NOSCRIPT: 1, TEMPLATE: 1 };
  var ATTRS = ['placeholder', 'aria-label', 'title', 'alt'];

  function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
  function norm(s) { return String(s).replace(/\s+/g, ' ').trim(); }
  function esc(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

  function detect() {
    var want = (typeof navigator !== 'undefined' && (navigator.languages || [navigator.language])) || [];
    for (var i = 0; i < want.length; i++) {
      var w = String(want[i] || '').toLowerCase();
      if (/^zh-(tw|hk|mo|hant)/.test(w)) return 'zh-Hant';
      if (/^zh/.test(w)) return 'zh-Hans';
      if (/^pcm/.test(w)) return 'pcm';
      var b = w.split('-')[0];
      if (b === 'en') return 'en';
      if (CODES.indexOf(b) > -1) return b;
    }
    return 'en';
  }
  function setDict(code, d) {
    lang = code; dict = d || null; cache = new Map(); tpls = [];
    var loc = locale();
    try { plural = new Intl.PluralRules(loc); } catch (e) { plural = null; }
    if (!dict) return;
    Object.keys(dict).forEach(function (k) {
      if (k.indexOf('{0}') < 0) return;
      var lit = k.replace(/\{\d\}/g, '');
      var re = new RegExp('^' + esc(k).replace(/\\\{(\d)\\\}/g, '(.+?)') + '$');
      tpls.push({ re: re, out: dict[k], w: lit.length, joiner: !/[A-Za-z]/.test(lit.replace(/<[^>]+>/g, '')), order: (k.match(/\{\d\}/g) || []).map(function (x) { return +x[1]; }) });
    });
    tpls.sort(function (a, b) { return b.w - a.w; });
  }
  function pick(v, n) {
    if (v && typeof v === 'object') { var cat = 'other'; try { if (plural && n !== null && !isNaN(n)) cat = plural.select(n); } catch (e) {} return v[cat] || v.other || v.one || ''; }
    return v;
  }
  function lookup(s) {
    var k = norm(s);
    if (!k || !/[A-Za-z]/.test(k)) return null;
    if (collect && !dict) { collect(k); return null; }
    if (!dict) return null;
    if (Object.prototype.hasOwnProperty.call(dict, k)) { var v = dict[k]; return typeof v === 'object' ? pick(v, null) : v; }
    if (cache.has(k)) return cache.get(k);
    var out = null;
    for (var i = 0; i < tpls.length; i++) {
      var m = tpls[i].re.exec(k); if (!m) continue;
      var t = tpls[i], firstNum = null, bad = false;
      for (var j = 1; j < m.length; j++) if (firstNum === null && /^-?\d+$/.test(m[j])) firstNum = +m[j];
      var res = String(pick(t.out, firstNum)).replace(/\{(\d)\}/g, function (_, n) {
        var cap = m[t.order.indexOf(+n) + 1]; if (cap === undefined) return '';
        var tr2 = lookup(cap);
        // a joiner like "{0}, {1}" only glues short pieces; it never half-translates a whole English sentence
        if (tr2 === null && t.joiner && cap.split(/\s+/).length > 3) bad = true;
        return tr2 === null ? cap : tr2;
      });
      if (bad) continue;
      out = res; break;
    }
    if (out === k) out = null; // a joiner matched but nothing in it had a translation
    if (out === null && collect) collect(k);
    if (cache.size > 4000) cache.clear();
    cache.set(k, out);
    return out;
  }
  function tr(s) {
    if (s == null) return s;
    if (typeof s === 'string' && s.indexOf('\n') > -1 && dict) return s.split('\n').map(tr).join('\n');
    var r = lookup(s); if (r === null) return s;
    var lead = /^\s*/.exec(s)[0], tail = /\s*$/.exec(s)[0];
    return lead + r + tail;
  }
  function inlineBlock(el) {
    var kids = el.childNodes, hasEl = false, hasText = false;
    for (var i = 0; i < kids.length; i++) {
      var n = kids[i];
      if (n.nodeType === 3) { if (/\S/.test(n.nodeValue)) hasText = true; continue; }
      if (n.nodeType !== 1) continue;
      if (!INLINE[n.tagName] || n.attributes.length) return false;
      for (var j = 0; j < n.childNodes.length; j++) if (n.childNodes[j].nodeType !== 3) return false;
      hasEl = true;
    }
    return hasEl && hasText;
  }
  function doText(n) {
    var v = n.nodeValue; if (!v || !/[A-Za-z]/.test(v)) return;
    if (outs.get(n) === v) return;
    var t = /\n\s*\S/.test(v.trim()) ? v.split('\n').map(tr).join('\n') : tr(v); if (t !== v) { outs.set(n, t); n.nodeValue = t; }
  }
  function doAttrs(el) {
    for (var i = 0; i < ATTRS.length; i++) {
      var a = ATTRS[i]; if (!el.hasAttribute || !el.hasAttribute(a)) continue;
      var v = el.getAttribute(a), mark = 'i18n:' + a;
      if (el[mark] === v) continue;
      var t = tr(v); if (t !== v) { el[mark] = t; el.setAttribute(a, t); }
    }
    if (el.tagName === 'INPUT' && (el.type === 'button' || el.type === 'submit') && el.value) { var tv = tr(el.value); if (tv !== el.value) el.value = tv; }
  }
  function walk(root) {
    if (!dict && !collect) return;
    if (!root) return;
    if (root.nodeType === 3) { var p = root.parentNode; if (p && !skipped(p)) { if (inlineBlock(p)) doBlock(p); else doText(root); } return; }
    if (root.nodeType !== 1 && root.nodeType !== 9 && root.nodeType !== 11) return;
    if (root.nodeType === 1 && root.tagName === 'TEXTAREA' && !skipped(root.parentNode || root)) { doAttrs(root); return; }
    if (root.nodeType === 1 && skipped(root)) return;
    if (root.nodeType === 1) {
      doAttrs(root);
      if (inlineBlock(root) && doBlock(root)) return;
    }
    var kids = root.childNodes;
    for (var i = 0; i < kids.length; i++) {
      var n = kids[i];
      if (n.nodeType === 3) doText(n);
      else if (n.nodeType === 1) {
        if (!SKIP[n.tagName] && !(n.hasAttribute && n.hasAttribute('data-noi18n'))) walk(n);
        else if (n.tagName === 'TEXTAREA' && !n.hasAttribute('data-noi18n')) doAttrs(n); // what's typed stays as typed, but the hint inside is translated
      }
    }
  }
  function doBlock(el) {
    var html = el.innerHTML; if (outs.get(el) === html) return true;
    var t = lookup(html);
    if (t === null) {
      if (collect && !dict) return true; // collected as one sentence
      return false;
    }
    outs.set(el, t); el.innerHTML = t; outs.set(el, el.innerHTML);
    return true;
  }
  function skipped(el) {
    for (var e = el; e && e.nodeType === 1; e = e.parentNode) { if (SKIP[e.tagName] || e.hasAttribute('data-noi18n')) return true; }
    return false;
  }
  var mo = null;
  function observe() {
    if (mo || typeof MutationObserver === 'undefined' || (!dict && !collect)) return;
    mo = new MutationObserver(function (list) {
      for (var i = 0; i < list.length; i++) {
        var m = list[i];
        if (m.type === 'childList') { for (var j = 0; j < m.addedNodes.length; j++) walk(m.addedNodes[j]); if (m.target.nodeType === 1 && inlineBlock(m.target) && !skipped(m.target)) doBlock(m.target); }
        else if (m.type === 'characterData') walk(m.target);
        else if (m.type === 'attributes') { if (m.target.nodeType === 1 && (!skipped(m.target) || (m.target.tagName === 'TEXTAREA' && !m.target.hasAttribute('data-noi18n')))) doAttrs(m.target); }
      }
    });
    mo.observe(document.documentElement, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ATTRS });
    walk(document.documentElement);
  }
  function locale() { for (var i = 0; i < LANGS.length; i++) if (LANGS[i][0] === lang) return LANGS[i][2]; return 'en-GB'; }
  function packUrl(code) { return 'lang/' + code + '.json?v=' + PACK_VER; } // a new address for each version, so no old copy is used
  function loadPack(code) {
    var embedded = typeof window !== 'undefined' && window.SHEPHERD_LANGS && window.SHEPHERD_LANGS[code];
    if (embedded) return Promise.resolve(embedded);
    var cached = ls('shepherd:langpack:' + code);
    if (cached) { try { var o = JSON.parse(cached); if (o && o.v === PACK_VER && o.d) return Promise.resolve(o.d); } catch (e) {} }
    if (typeof fetch === 'undefined') return Promise.resolve(null);
    return fetch(packUrl(code), { cache: 'no-cache' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (d) {
      if (d) ls('shepherd:langpack:' + code, JSON.stringify({ v: PACK_VER, d: d }));
      return d;
    }).catch(function () { return null; });
  }
  function cachedPackSync(code) {
    var embedded = typeof window !== 'undefined' && window.SHEPHERD_LANGS && window.SHEPHERD_LANGS[code];
    if (embedded) return embedded;
    var cached = ls('shepherd:langpack:' + code);
    if (cached) { try { var o = JSON.parse(cached); if (o && o.v === PACK_VER) return o.d; } catch (e) {} }
    return null;
  }
  var ready = Promise.resolve();
  function start(code) {
    code = CODES.indexOf(code) > -1 ? code : 'en';
    if (code === 'en') { setDict('en', null); applyDoc(); observe(); return Promise.resolve(); }
    var d = cachedPackSync(code);
    if (d) { setDict(code, d); applyDoc(); observe(); ready = Promise.resolve(); loadPack(code); return ready; }
    setDict(code, null); applyDoc();
    ready = loadPack(code).then(function (p) { if (p && lang === code) { setDict(code, p); observe(); walk(document.documentElement); } });
    return ready;
  }
  function applyDoc() {
    try { document.documentElement.lang = locale(); } catch (e) {}
  }
  var saved = ls('shepherd:lang');
  var I18N = {
    LANGS: LANGS, codes: CODES,
    get lang() { return lang; },
    locale: locale, tr: tr, detect: detect, ready: function () { return ready; },
    has: function (s) { return lookup(s) !== null; },
    // translate this part of the page now (before measuring it)
    apply: function (el) { if (dict && el) walk(el); },
    // fill a sentence: fmt('Hi {0}!', ['Ama']) in the chosen language (for text that leaves the screen, like an invite)
    fmt: function (key, args) {
      args = args || []; var v = dict && Object.prototype.hasOwnProperty.call(dict, key) ? dict[key] : key;
      var n = null; for (var i = 0; i < args.length; i++) if (typeof args[i] === 'number') { n = args[i]; break; }
      return String(pick(v, n)).replace(/\{(\d)\}/g, function (_, j) { return args[+j] == null ? '' : String(args[+j]); });
    },
    // remember the choice on this phone, then reload so every screen starts fresh in the new language
    use: function (code, reload) {
      code = CODES.indexOf(code) > -1 ? code : 'en';
      ls('shepherd:lang', code);
      if (code === lang) return Promise.resolve(false);
      return loadPack(code).then(function () { if (reload !== false && typeof location !== 'undefined') location.reload(); return true; });
    },
    chosen: function () { return saved || ''; }
  };
  window.I18N = I18N;
  start(collect ? 'en' : (saved || detect()));
  if (collect) observe();
})();

</script>

<script>/* src/privacy.js */
/* Shepherd's privacy notice and acceptable use statement. Used in the app (Settings › Privacy and safe use, and the
   one-time "Before you start" agreement) and on its own page, privacy.html, so anyone can read it before signing up.
   Written in English; the language files translate it on screen. */
(function () {
  var USE_VERSION = 1; // raise this when the acceptable use statement changes, so everyone agrees to the new one
  var UPDATED = '2026-10-29';
  function cfg() { var c = (window.SHEPHERD_CONFIG && window.SHEPHERD_CONFIG.privacy) || {}; return { controller: c.controller || 'Pavi', contact: c.contact || 'lostshepherdapp@gmail.com' }; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (ch) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]; }); }
  function when() {
    var d = new Date(UPDATED + 'T12:00:00');
    try { var loc = window.I18N && I18N.lang !== 'en' ? I18N.locale() : 'en-GB'; if (Intl.DateTimeFormat.supportedLocalesOf([loc]).length) return new Intl.DateTimeFormat(loc, { day: 'numeric', month: 'long', year: 'numeric' }).format(d); } catch (e) {}
    return '29 October 2026';
  }
  function sec(title, body) { return '<section class="card pv"><h3>' + title + '</h3>' + body + '</section>'; }
  function ul(items) { return '<ul class="steps">' + items.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul>'; }
  function rules() {
    return ul([
      'You are responsible for the people you choose to contact through Shepherd.',
      'Only add and contact people whose details you got fairly, for example they gave you their number or scanned your QR code.',
      'If someone asks you to stop messaging them, stop. Mark them <b>No longer contact</b>, and delete their details if they ask.',
      'Don\'t share anyone\'s contact details without a good reason and their agreement.',
      'Never use Shepherd for spam, bulk messages, harassment or anything unlawful.',
      'You remain responsible for following data protection and privacy law when you use Shepherd.'
    ]);
  }
  function contactLine(c) {
    return c.contact
      ? '<p class="note">For any privacy question, or to ask what is held about you, or for it to be corrected or removed, email <b>' + esc(c.contact) + '</b>.</p>'
      : '<p class="note">For any privacy question, or to ask what is held about you, or for it to be corrected or removed, ask <b>' + esc(c.controller) + '</b> through your church.</p>';
  }
  // the whole notice
  function html() {
    var c = cfg();
    return '<p style="margin:0">Shepherd is a personal tool. It helps you remember to follow up with people you know, using your own WhatsApp. It isn\'t a church database or a marketing tool, and nobody else can see your list.</p>' +
      '<p class="note pvdate">Last updated <b>' + esc(when()) + '</b></p>' +
      sec('Who is responsible',
        '<p class="note">Shepherd is run by <b>' + esc(c.controller) + '</b>, who is responsible for how it handles information (the data controller).</p>' + contactLine(c)) +
      sec('Your responsibility',
        '<p class="note">You decide who to add and what to write about them. You are responsible for the people you contact through Shepherd and for the information you keep about them.</p>' +
        '<p class="note">Only write what you would be comfortable for that person to read. Don\'t record health or other sensitive details unless they are happy for you to keep them.</p>') +
      sec('Acceptable use', '<p class="note">Everyone who uses Shepherd agrees to this:</p>' + rules()) +
      sec('What Shepherd keeps, and why',
        '<p class="note"><b>Data linked to you</b>, saved to your own private account so your list is on every phone you sign in on and isn\'t lost:</p>' +
        ul(['Your name, email, WhatsApp number, home country and settings (such as language, time zone and notification times).', 'The people you add: their names, phone numbers, social handles, notes, prayer points and Bible studies, and whether they agreed to be added.', 'Your events, disciples and prayer list.', 'For each phone you\'re signed in on: when it signed in and was last used, and what kind of browser it is, so it stays signed in.', 'The notifications planned for the next two weeks. Once sent, only the time is kept, for 3 days.']) +
        '<p class="note"><b>Kept only on this phone</b>:</p>' +
        ul(['Contacts you import from your phone, used to suggest names as you type. They are never uploaded.', 'A copy of your list, so Shepherd works without signal.']) +
        '<p class="note"><b>Never collected</b>:</p>' +
        ul(['Your location.', 'Your WhatsApp, text or iMessage conversations.', 'Your whole address book (only the contacts you choose).', 'Anything for adverts or tracking.']) +
        '<p class="note"><b>When someone scans your QR code</b>: they choose to type their name (and number if they want) and tick that they\'re happy to be added. It goes only into your list, and they then message you on WhatsApp themselves.</p>' +
        '<p class="note"><b>If you connect your phone calendar</b>: a private calendar link shows your Bible studies (with first names and topics) and your events. Anyone you give that link to can see them, and your phone\'s calendar service (such as Apple or Google) keeps a copy. You can replace the link in Shepherd at any time.</p>') +
      sec('How it\'s protected',
        ul(['Your list is saved to your own private account. Nobody else using Shepherd can see it.',
          'Everything travels over an encrypted connection and is stored with Cloudflare, which encrypts it on its servers.',
          'Your password is scrambled on your phone before it is sent and scrambled again on the server, so nobody can read it.',
          'Phone notifications are encrypted on the way to your phone and only show first names, never notes or prayer points.',
          'Shepherd\'s fonts and code come from Shepherd itself, so no advertising or tracking company sees you use it.',
          'Shepherd never sends messages for you. Every WhatsApp message is one you send yourself.',
          'If you ask for a password reset code by email, it is sent to the address you typed, from <b>' + esc(c.contact) + '</b> through Google\'s Gmail.',
          'Earlier versions are kept for up to a year so nothing is lost by mistake. Deleting someone\'s data removes every copy Shepherd keeps.',
          'For emergencies, the whole database can be restored to any point in the last 7 days, so a deletion is fully gone after 7 days.',
          'The server is looked after by <b>' + esc(c.controller) + '</b>, who doesn\'t look at anyone\'s list and only reaches stored data to keep Shepherd running or to act on a request to remove someone.'])) +
      sec('Keep your phone safe',
        ul(['Lock your phone with a passcode, Face ID or fingerprint.',
          'Turn on Shepherd\'s own PIN in <b>Settings › App lock</b>.',
          'Keep your phone and Shepherd up to date. When Shepherd says a new version is ready, tap <b>Update</b>.',
          'Don\'t share your password, and sign out on phones that aren\'t yours.',
          'Lost your phone? Sign in on another phone and change your password. That signs the lost phone out.'])) +
      sec('How long it\'s kept, and your choices',
        ul(['Information stays until you delete it. People you stop contacting are kept under No longer contacting until you delete them.',
          'Someone asks you to delete their details? Open them, tap <b>No longer contact</b>, then <b>Delete all their data</b>. That removes them from Shepherd, including your prayer list. Copies you made yourself, such as an exported backup or your phone\'s contacts, are yours to delete.',
          'Export a backup at any time from Settings. <b>Delete my account</b> removes everything for good.',
          'Anyone can ask what Shepherd holds about them, and ask for it to be corrected or removed.']) + contactLine(c));
  }
  // the short version everyone agrees to once
  function agreeHtml() {
    return '<p style="margin:0">Shepherd is your personal tool for following up with people you know. Before you start, please agree to use it responsibly:</p>' + rules();
  }
  window.ShepherdPrivacy = { html: html, agreeHtml: agreeHtml, USE_VERSION: USE_VERSION };
})();

</script>

<main>
<header><svg viewBox="0 0 104 104" aria-hidden="true"><rect width="104" height="104" rx="24" fill="#FAF3DF" stroke="#D8C8A2" stroke-width="3"/><path d="M45 79 V37 a12 12 0 0 1 12 -12 a12 12 0 0 1 12 12 v6" fill="none" stroke="#4E5A33" stroke-width="7" stroke-linecap="round"/></svg><h1>Privacy and safe use</h1></header>
<div id="pv" style="display:grid;gap:14px"></div>
<a class="open" href="./">Open Shepherd</a>

<script>document.getElementById("pv").innerHTML = window.ShepherdPrivacy.html();</script>
