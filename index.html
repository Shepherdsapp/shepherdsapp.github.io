<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="description" content="Shepherd helps you follow up with the people you share your faith with: who to message, who to reply to, Bible studies and disciples.">
<meta name="theme-color" content="#FAF3DF">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shepherd">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<title>Shepherd</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Literata:opsz,wght@7..72,500;7..72,600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Always the light cream look, matching the app icon (butter cream #FAF3DF, green #4E5A33), even when the phone is in dark mode.
   Layout: phone-first app shell. One column of views, a tab dock along the bottom, and sheets that slide up for every form. */
:root{
  --bg:#FAF3DF; --surface:#FFFCF3; --surface-2:#F0E4C6; --fg:#241F18; --muted:#574D3E; --line:#D8C8A2;
  --card-shadow:0 1px 0 rgba(70,52,22,.06),0 10px 22px -16px rgba(70,52,22,.45);
  --accent:#4E5A33; --accent-ink:#FFFBF3; --accent-soft:#E3E2C7; --gold:#9C7428; --gold-soft:#F2E4C4;
  --ok:#3B7449; --ok-soft:#DCEAD7; --warn:#A06E0E; --warn-soft:#F5E5BF; --bad:#A9423A; --bad-soft:#F4DAD3; --idle:#857A6B; --idle-soft:#E8E1D2;
  --tile:#FAF3DF;
  color-scheme:light;
  --shadow:0 12px 32px -20px rgba(70,52,22,.5);
  --display:"Literata",Georgia,"Times New Roman",serif;
  --body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:16px; --r-sm:11px; --dock:66px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)} .small{font-size:14px}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* shell */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid transparent}
.top.scrolled{border-bottom-color:var(--line)}
.top-in{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:10px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:.01em;min-width:0}
.mark{width:30px;height:30px;border-radius:8px;flex:none;display:block}
.mark rect{fill:var(--tile)} .mark path{fill:none;stroke:var(--accent);stroke-width:8;stroke-linecap:round}
.sync{margin-left:auto;font-size:12.5px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.sync.saving i{background:var(--warn)} .sync.offline i,.sync.local i,.sync.loading i{background:var(--idle)} .sync.error i,.sync.readonly i{background:var(--bad)}
.iconbtn{width:44px;height:44px;border-radius:13px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--fg);flex:none}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:6px calc(var(--dock) + 110px)}
.view{display:grid;gap:18px;animation:in .3s ease}
@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}

.banner{border-radius:var(--r-sm);padding:10px 12px;font-size:14px;background:var(--gold-soft);color:var(--fg);display:flex;gap:10px;align-items:flex-start;margin:0}
.banner b{font-weight:600}

/* type */
.eyebrow{margin:0;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--gold);font-weight:700}
.h1{font-family:var(--display);font-weight:600;font-size:clamp(26px,7vw,32px);line-height:1.12;margin:2px 0 0;text-wrap:balance;overflow-wrap:anywhere}
.h2{font-family:var(--display);font-weight:600;font-size:20px;margin:0;text-wrap:balance}
.sec{display:grid;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec-h .count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.lede{margin:4px 0 0;color:var(--muted)}

/* summary pills */
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;font-size:14px;font-weight:600;background:var(--surface);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.pill.late{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.pill.due{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.pill.okp{background:var(--ok-soft);border-color:transparent;color:var(--ok)}

/* people rows */
.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.prow{display:flex;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.prow-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left;background:none;border:0;padding:12px 6px 12px 14px;min-height:60px}
.dot{width:12px;height:12px;border-radius:50%;flex:none;background:var(--idle);box-shadow:0 0 0 4px var(--idle-soft)}
.st-ok .dot{background:var(--ok);box-shadow:0 0 0 4px var(--ok-soft)}
.st-due .dot{background:var(--warn);box-shadow:0 0 0 4px var(--warn-soft)}
.st-late .dot{background:var(--bad);box-shadow:0 0 0 4px var(--bad-soft)}
.st-event .dot{background:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
.pm{display:grid;min-width:0}
.pn{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ps{font-size:13.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-late .ps b{color:var(--bad);font-weight:600} .st-due .ps b{color:var(--warn);font-weight:600} .st-ok .ps b{color:var(--ok);font-weight:600}
.ps b{font-weight:600}
.ch{width:58px;display:grid;place-items:center;align-content:center;gap:2px;border:0;border-left:1px solid var(--line);background:var(--accent-soft);color:var(--accent);text-decoration:none;flex:none;font-size:10.5px;font-weight:700;letter-spacing:.02em}
.ch svg{width:22px;height:22px}
.ch.off{background:var(--surface-2);color:var(--muted)}
.ex{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:1px 7px;border-radius:99px;background:var(--gold-soft);color:var(--gold);vertical-align:2px;margin-left:6px}

/* cards & forms */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px}
.card h3{margin:0;font-size:15px;font-weight:700}
.kv{display:grid;grid-template-columns:minmax(0,9.5em) minmax(0,1fr);gap:6px 12px;font-size:15px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
@media (max-width:400px){.kv{grid-template-columns:1fr}.kv dd{margin-bottom:6px}}
.btn{min-height:44px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--fg);transition:transform .15s ease;text-align:center}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.soft{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.btn.danger{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>.grow{flex:1 1 140px}
.ghost-btn{background:none;border:0;padding:8px 4px;min-height:44px;display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-weight:600}
.field{display:grid;gap:5px;font-size:14px;color:var(--muted);font-weight:500}
.inp{width:100%;min-height:46px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:16px;outline:none}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{min-height:84px;resize:vertical}
select.inp{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>*{min-width:0}
.handle{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr);gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;min-height:30px;padding:4px 11px;border-radius:99px;font-size:13.5px;background:var(--surface-2);color:var(--fg)}
.chip.st-late{background:var(--bad-soft);color:var(--bad);font-weight:600}
.chip.st-due{background:var(--warn-soft);color:var(--warn);font-weight:600}
.chip.st-ok{background:var(--ok-soft);color:var(--ok);font-weight:600}
.chip.st-paused,.chip.st-archived{background:var(--idle-soft);color:var(--idle);font-weight:600}
.chip.cal{background:var(--gold-soft);color:var(--gold);font-weight:600}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick button{min-height:40px;padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:var(--bg);font-size:14.5px}
.pick button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:13px;background:var(--surface-2)}
.seg button{min-height:42px;border:0;border-radius:10px;background:none;font-size:13.5px;font-weight:600;color:var(--muted);padding:4px 6px;line-height:1.2}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button[aria-pressed="true"].me{color:var(--bad)}
.hero{display:grid;gap:12px}
.timeline{list-style:none;margin:0;padding:0;display:grid}
.timeline li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;padding:9px 0;border-top:1px dashed var(--line);font-size:14.5px}
.timeline li:first-child{border-top:0}
.timeline time{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.study{display:grid;gap:3px;padding:10px 0;border-top:1px solid var(--line)}
.study:first-of-type{border-top:0}
.study b{font-weight:600}
.empty{text-align:center;padding:26px 18px;display:grid;gap:12px;justify-items:center;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.empty .mark{width:64px;height:64px;border-radius:16px}
.empty>svg{width:56px;height:56px;stroke:var(--accent);fill:none;stroke-width:1.6;stroke-linecap:round}
.empty p{margin:0;color:var(--muted);max-width:34ch}
.allclear{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:var(--r);background:var(--ok-soft);color:var(--ok);font-weight:600}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search .inp{padding-left:40px}
.filters{display:flex;flex-wrap:wrap;gap:7px;padding-bottom:2px}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;min-height:38px;padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:14px;white-space:nowrap}
.filters button[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg);font-weight:600}
.linkrow{background:none;border:0;padding:12px 0;min-height:44px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:14.5px;justify-self:start}
.ticks{list-style:none;margin:0;padding:0;display:grid}
.ticks li{border-top:1px solid var(--line)} .ticks li:first-child{border-top:0}
.ticks label{display:flex;gap:12px;align-items:flex-start;padding:10px 0;min-height:48px;cursor:pointer}
.ticks input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin:1px 0 0}
.ticks b{display:block;font-weight:600}
.ticks span span{display:block;font-size:13.5px;color:var(--muted)}
.preview{background:var(--bg);border-radius:var(--r-sm);padding:12px 14px;font-size:14.5px;white-space:pre-wrap;border:1px solid var(--line)}

/* week */
.bigline{font-family:var(--display);font-size:clamp(24px,6.4vw,30px);line-height:1.2;margin:0;text-wrap:balance}
.bigline em{font-style:normal;color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;min-width:0}
.stat span{display:block;font-size:12.5px;color:var(--muted)}
.stat b{font-size:24px;font-variant-numeric:tabular-nums;font-weight:600}
.bars{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:end;height:150px;padding-top:18px}
.bar{display:grid;grid-template-rows:auto 1fr auto;gap:4px;height:100%;text-align:center;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar .track{position:relative;background:var(--surface-2);border-radius:8px;overflow:hidden}
.bar .fill{position:absolute;left:0;right:0;bottom:0;background:var(--accent);border-radius:8px 8px 0 0}
.bar.now .fill{background:var(--gold)}

/* events */
.ev{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-height:64px}
.calbox{display:grid;justify-items:center;border-radius:10px;background:var(--accent-soft);color:var(--accent);padding:4px 0;line-height:1.1}
.calbox b{font-size:20px;font-family:var(--display)} .calbox span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.ev.fromcal .calbox{background:var(--gold-soft);color:var(--gold)}
.ev.past .calbox{background:var(--surface-2);color:var(--muted)}
.checklist{list-style:none;margin:0;padding:0;display:grid}
.checklist li{display:flex;align-items:center;gap:10px;min-height:52px;border-top:1px solid var(--line)}
.checklist li:first-child{border-top:0}
.checklist label{flex:1;display:flex;align-items:center;gap:10px;min-height:48px;cursor:pointer;min-width:0}
.checklist input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.checklist .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.checklist .ch{width:44px;height:40px;border-radius:10px;border:0}
.checklist .came{flex:none;font-size:13px;color:var(--muted);white-space:nowrap}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.dock-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--dock)}
.tab{background:none;border:0;display:grid;justify-items:center;align-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted);position:relative}
.tab svg{width:23px;height:23px}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.tab .badge{position:absolute;top:8px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--bad);color:var(--surface);font-size:11px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.fab{position:fixed;z-index:31;right:max(16px,calc(50% - 264px));bottom:calc(var(--dock) + 16px + env(safe-area-inset-bottom,0px));height:56px;padding:0 20px 0 16px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow)}
.fab svg{width:22px;height:22px;stroke-width:2.2}
.fab:active{transform:scale(.96)}

/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(30,22,10,.42);opacity:0;transition:opacity .25s ease}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:calc(100% - 36px - env(safe-area-inset-top,0px));display:flex;flex-direction:column;background:var(--surface);border-radius:22px 22px 0 0;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);max-width:600px;margin:0 auto;box-shadow:0 -10px 40px -20px rgba(0,0,0,.5)}
.sheet.on{transform:none} .scrim.on{opacity:1}
.sheet-h{display:flex;align-items:center;gap:8px;padding:10px 10px 6px 20px}
.sheet-h::before{content:"";position:absolute;left:50%;top:7px;width:38px;height:4px;border-radius:4px;background:var(--line);transform:translateX(-50%)}
.sheet-h h2{flex:1;margin:10px 0 0;font-family:var(--display);font-size:21px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.sheet-b{overflow-y:auto;padding:8px 20px calc(24px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;overscroll-behavior:contain}
.qr{display:grid;place-items:center;padding:16px;background:#FFFDF6;border-radius:var(--r);border:1px solid var(--line);justify-self:center;color:#2A251E}
.qr img,.qr canvas{display:block;max-width:100%}
.note{font-size:13.5px;color:var(--muted);margin:0}
.copybox{width:100%;min-height:110px}

/* lock */
.lock{position:fixed;inset:0;z-index:60;background:var(--bg);display:grid;place-items:center;padding:24px 16px}
.lock-in{width:100%;max-width:320px;display:grid;gap:14px;text-align:center;justify-items:center}
.lock-in .mark{width:64px;height:64px;border-radius:16px}
.lock .inp{text-align:center;font-size:26px;letter-spacing:.4em}

/* toast */
.toast{position:fixed;z-index:50;left:16px;right:16px;bottom:calc(var(--dock) + 84px + env(safe-area-inset-bottom,0px));max-width:420px;margin:0 auto;background:var(--fg);color:var(--bg);border-radius:14px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:10px;font-size:14.5px;box-shadow:var(--shadow);transform:translateY(20px);opacity:0;transition:all .25s ease;pointer-events:none}
.toast.on{transform:none;opacity:1;pointer-events:auto}
.toast span{flex:1}
.toast button{background:none;border:0;color:var(--gold-soft);font-weight:700;min-height:40px;padding:0 10px}

/* disciples */
.verse{margin:0;padding:16px 18px;border-radius:var(--r);background:var(--gold-soft);display:grid;gap:6px}
.verse p{margin:0;font-family:var(--display);font-size:17.5px;line-height:1.4;text-wrap:balance}
.verse cite{font-style:normal;font-size:13px;color:var(--muted);font-weight:600}
.meter{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.meter .track{flex:1;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.meter .track span{display:block;height:100%;background:var(--accent);border-radius:99px}

/* step-by-step guides */
.steps{margin:0;padding-left:22px;display:grid;gap:9px}
.steps li{font-size:15px;line-height:1.45;padding-left:2px}
.steps li::marker{color:var(--accent);font-weight:700}
.steps b{font-weight:600}
.path{font-weight:600;color:var(--fg)}

/* one-tap reply buttons on rows */
.rep{flex:none;align-self:center;margin-right:8px;min-height:36px;padding:4px 11px;border-radius:99px;border:1px solid var(--line);background:var(--bg);font-size:13px;font-weight:700;color:var(--accent);white-space:nowrap}
.rep.me{color:var(--bad)}

/* catch-up */

.tourpill span{flex:1 1 160px;font-size:14.5px}
.btn.small{min-height:38px;padding:6px 12px;font-size:14px}
.tour-foot .step{font-size:13px;color:var(--muted);margin-right:auto;font-variant-numeric:tabular-nums}
.tour-foot #tourNext{order:-1;flex:1 1 100%}
.tour-foot .btn:not(#tourNext){min-height:44px;padding:8px 16px}

/* iPhone and Android steps, side by side in every how-to */
.os{display:grid;gap:10px}
.osb{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surface);display:grid;gap:8px}

.tag{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:99px;background:var(--fg);color:var(--bg)}
.tag.and{background:var(--accent);color:var(--accent-ink)}

.summary{display:grid;gap:8px;margin:0;padding:0;list-style:none}

.summary li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;margin-top:8px}

/* bolder, easier to see: bigger text, darker lines, cards that stand out */

.card{border-width:1.5px;padding:18px;box-shadow:var(--card-shadow)}

function followedIn(c, ws, we) { return (c.log || []).some(function (l) { return (l.k === 'contact' || l.k === 'study') && l.t >= ws && l.t < we; }); }
function weekStats(ws) {
  var we = addDays(ws, 7);
  var pool = list().filter(function (c) {
    if ((c.createdAt || 0) >= we) return false;
    if (followedIn(c, ws, we)) return true;
    if (c.status === 'archived' && (!c.archivedAt || c.archivedAt < ws)) return false;
    if (c.status === 'paused' && c.pausedAt && c.pausedAt < ws && c.pauseUntil && parseYmd(c.pauseUntil) >= we) return false;
    return true;
  });
  var done = pool.filter(function (c) { return followedIn(c, ws, we); });
  return { ws: ws, we: we, pool: pool, done: done };
}
function weekWord(n, d) { var r = d ? n / d : 0; return !d ? '' : r >= 0.9 ? 'great week' : r >= 0.6 ? 'good going' : n > 0 ? 'keep going' : 'start with today\'s list'; }
function viewWeek() {
  var ws = weekStart(Date.now()), cur = weekStats(ws);
  var studies = 0, added = 0, came = 0;
  list().forEach(function (c) {
    (c.studies || []).forEach(function (s) { var t = parseYmd(s.date); if (t >= ws && t < cur.we) studies++; });
    if ((c.createdAt || 0) >= ws && c.createdAt < cur.we) added++;
  });
  evList().forEach(function (x) { var t = parseYmd(x.date); if (t >= ws && t < cur.we) came += (x.came || []).length; });
  var n = cur.done.length, d = cur.pool.length;
  var h = '<div><p class="eyebrow">Week of ' + fmtDay(ws) + '</p>';
  h += d ? '<p class="bigline">You followed up with <em>' + n + ' of ' + d + '</em> — ' + weekWord(n, d) + '.</p>' : '<p class="bigline">Your weekly summary will appear once you add contacts.</p>';
  h += '</div><div class="stats"><div class="stat"><span>Studies</span><b>' + studies + '</b></div><div class="stat"><span>New contacts</span><b>' + added + '</b></div><div class="stat"><span>Came to events</span><b>' + came + '</b></div></div>';
  var weeks = [];
  for (var i = 3; i >= 0; i--) weeks.push(weekStats(addDays(ws, -7 * i)));
  h += '<section class="card"><h3>Follow-up rate, last 4 weeks</h3><div class="bars">' + weeks.map(function (w, idx) {
    var pct = w.pool.length ? Math.round(w.done.length / w.pool.length * 100) : 0;
    var dd = new Date(w.ws);
    return '<div class="bar' + (idx === 3 ? ' now' : '') + '"><span>' + (w.pool.length ? pct + '%' : '–') + '</span><div class="track"><div class="fill" style="height:' + pct + '%"></div></div><span>' + (idx === 3 ? 'This week' : fmtDay(dd)) + '</span></div>';
  }).join('') + '</div><p class="note">Share of the people you were following up with who got a message, a call or a study that week.</p></section>';
  var notYet = cur.pool.filter(function (c) { return cur.done.indexOf(c) < 0 && eff(c) === 'active'; }).sort(byDue);
  h += section('Not reached yet this week', notYet);
  return h;

function digest(p) {
  var N = (p || S.profile).notify || {};
  var L = todayLists(), lines = [];
  var names = function (arr, f) { var a = arr.slice(0, 4).map(f); return a.join(', ') + (arr.length > 4 ? ' and ' + (arr.length - 4) + ' more' : ''); };
  if (N.chase && L.msg.length) lines.push('Message ' + plural(L.msg.length, 'person', 'people') + ': ' + names(L.msg, function (c) { var dd = -dayDiff(dueDay(c), today()); return firstName(c.name) + (dd > 0 ? ' (' + dd + 'd overdue)' : ''); }));
  if (N.replies && L.reply.length) lines.push('Reply to ' + names(L.reply, function (c) { return firstName(c.name); }));
  var waiting = active().filter(function (c) { return c.replyState === 'them' && startOf(waitSince(c)) < today(); }).sort(function (a, b) { return waitSince(a) - waitSince(b); });
  if (N.catchup && waiting.length) lines.push('Did they reply? ' + names(waiting, function (c) { return firstName(c.name) + ' (' + waitDays(c) + 'd)'; }));
  var dTodo = discipleToDo();
  if (N.disciples && dTodo.length) lines.push('Disciples to check on this week: ' + names(dTodo, function (d) { return firstName(d.name); }));
  if (N.studies && L.studies.length) lines.push('Studies today: ' + names(L.studies, function (c) { return firstName(c.name) + (c.nextStudy.time ? ' at ' + fmtClock(c.nextStudy.time) : ''); }));
  if (N.events && L.events.length) lines.push('Events: ' + names(L.events, function (x) { return x.name + ' ' + fmtDate(x.date).toLowerCase() + (x.time ? ' at ' + fmtClock(x.time) : ''); }));
  if (N.weekly && new Date().getDay() === 0) { var w = weekStats(weekStart(Date.now())); if (w.pool.length) lines.push('This week you followed up with ' + w.done.length + ' of ' + w.pool.length + '.'); }
  var any = N.chase || N.replies || N.catchup || N.disciples || N.studies || N.events || N.weekly;
  if (!any) return 'Alerts are off.';
  return lines.length ? lines.join('\n') : 'Nothing due today.';
}

var sheetAfter = null;
function openSheet(title, body, mount, after) {

  var sh = $('#sheet'), sc = $('#scrim');

  $('#sheetTitle').textContent = title; sh.dataset.title = title; nb.innerHTML = body;
  sh.hidden = false; sc.hidden = false; document.body.classList.add('noscroll');
  requestAnimationFrame(function () { sh.classList.add('on'); sc.classList.add('on'); });

function closeSheet() {

/* ---------- calendar import (.ics) ---------- */

    if (l === 'END:VEVENT') { if (cur.start && cur.status !== 'CANCELLED') out.push(cur); cur = null; return; }

    else if (name === 'DTSTART') cur.start = parseDT(v);

/* ---------- backup ---------- */
function backupText() { return JSON.stringify({ app: 'Shepherd', version: 2, exportedAt: new Date().toISOString(), profile: Object.assign({}, S.profile, { pinHash: '' }), contacts: list(), events: evList(), disciples: dList(), prayers: prList() }, null, 2); }
function exportBackup() {
  var data = backupText();
  if (!DOWN) { copyText(data, 'Backup copied. Paste it into a note or email it to yourself.'); return; }
  DOWN.save({ filename: 'shepherd-backup-' + ymd(Date.now()) + '.json', data: data }).then(function (r) { if (r && r.status === 'saved') toast('Backup saved'); }).catch(function (e) { if (e && e.code === 'declined') return; copyText(data, 'Backup copied. Paste it into a note or email it to yourself.'); });
}
function importBackup(text) {
  var o; try { o = JSON.parse(text); } catch (e) { toast('That file isn\'t a Shepherd backup'); return; }
  if (!o || o.app !== 'Shepherd' || !Array.isArray(o.contacts)) { toast('That file isn\'t a Shepherd backup'); return; }
  var added = 0, updated = 0;
  o.contacts.forEach(function (c) { if (!c || !c.id || !c.name || !/^[A-Za-z0-9_-]{1,80}$/.test(c.id)) return; var cur = S.contacts[c.id]; if (!cur) { added++; S.contacts[c.id] = c; put(cPath(c.id), c); } else if ((c.updatedAt || 0) > (cur.updatedAt || 0)) { updated++; S.contacts[c.id] = c; put(cPath(c.id), c); } });
  (o.events || []).forEach(function (x) { if (!x || !x.id || !/^[A-Za-z0-9_-]{1,80}$/.test(x.id)) return; var cur = S.events[x.id]; if (!cur || (x.updatedAt || 0) > (cur.updatedAt || 0)) { S.events[x.id] = x; put(ePath(x.id), x); } });
  (o.disciples || []).forEach(function (x) { if (!x || !x.id || !x.name || !/^[A-Za-z0-9_-]{1,80}$/.test(x.id)) return; var cur = S.disciples[x.id]; if (!cur || (x.updatedAt || 0) > (cur.updatedAt || 0)) { S.disciples[x.id] = x; put(dPath(x.id), x); } });
  (o.prayers || []).forEach(function (x) { if (!x || !x.id || !x.name || !/^[A-Za-z0-9_-]{1,80}$/.test(x.id)) return; var cur = S.prayers[x.id]; if (!cur || (x.updatedAt || 0) > (cur.updatedAt || 0)) { S.prayers[x.id] = x; put(prPath(x.id), x); } });
  render(); toast('Restored: ' + added + ' added, ' + updated + ' updated');
}

/* ---------- actions ---------- */

function markContacted(c, how, waiting) {
  var keys = ['lastContact', 'replyState', 'status', 'pauseUntil', 'waitingSince', 'meSince', 'catchAskedOn'];
  var prev = {}; keys.forEach(function (k) { prev[k] = c[k]; }); prev.log = (c.log || []).slice();

  logTo(c, 'contact', how);
  saveContact(c);
  var dd = dayDiff(dueDay(c), today());
  toast(waiting ? 'Logged. Waiting on ' + firstName(c.name) + ' to reply.' : 'Logged. Next check-in ' + (dd <= 0 ? 'today' : dd === 1 ? 'tomorrow' : 'in ' + dd + ' days') + '.', 'Undo', function () { keys.forEach(function (k) { c[k] = prev[k]; }); c.log = prev.log; saveContact(c); });
}
function theyReplied(c) {

}
function iReplied(c) {

  saveContact(c); toast('Logged. Waiting on ' + firstName(c.name) + ' to reply.');
}
function setReplyState(c, r) {
  if (c.replyState === r) return;

  if (r === 'them') { c.waitingSince = Date.now(); c.meSince = null; }
  if (r === 'me') { c.meSince = Date.now(); }

}

    case 'addpray': if (c) { if (prList().some(function (x) { return x.contactId === c.id; })) { toast(firstName(c.name) + ' is already on your prayer list'); break; } savePrayer({ id: newId(), name: c.name, notes: c.prayer || '', contactId: c.id, createdAt: Date.now() }); toast(firstName(c.name) + ' added to your prayer list'); } break;

/* a tapped notification opens the person it was about */

function handleLaunch() {
  var q = new URLSearchParams(location.search), id = q.get('open'), v = q.get('view');

}
if (window.I18N && I18N.lang !== 'en') I18N.ready().then(function () { schedSoon(); }); // notifications in your language once it has loaded

  WEB.onSignedIn = function () { flush(); }; WEB.onOpen = function (u) { try { var q = new URL(u, location.href).searchParams; openFromLink(q.get('open'), q.get('view')); } catch (e) {} }; WEB.onInstallable = function () { if (!$('#sheet').hidden && $('#sheet').dataset.title === 'Turn on notifications') notifGuide(false); }; }

/* test hook: lets the automated checks reach internal helpers; unused in normal use */
window.__shepherd = { inviteText: inviteText, parseVCF: parseVCF, mergePhoneBook: mergePhoneBook, vcard: vcard, prayerPicks: prayerPicks, buildSchedule: buildSchedule, S: S, digest: digest, parseICS: parseICS, expandEvent: expandEvent, importICS: importICS, importBackup: importBackup, backupText: backupText, waNum: waNum, cleanHandle: cleanHandle, state: state, dueDay: dueDay, weekStats: weekStats, pending: function () { return pending; } };

/* ---------- boot ---------- */
async function boot() {
  S.lastDay = ymd(Date.now());
  var cached = lsGet('shepherd:last-uid');
  if (cached) { S.uid = cached; loadLocal(); }
  checkLock(); render();
  var db = null, user = null;
  if (window.claude && typeof window.claude.use === 'function') {
    try { var r = await Promise.all([window.claude.use('db').catch(function () { return null; }), window.claude.use('user').catch(function () { return null; })]); db = r[0]; user = r[1]; } catch (e) {}
    window.claude.use('downloads').then(function (d) { DOWN = d; }).catch(function () {});
  }
  var id = null;
  if (user) { try { id = await user.id(); } catch (e) {} try { S.isOwner = !!(user.isOwner && await user.isOwner()); } catch (e) {} }
  if (db && id) {
    if (S.uid !== id) {
      var prev = { contacts: S.contacts, events: S.events, disciples: S.disciples, prayers: S.prayers };
      S.uid = id; S.contacts = {}; S.events = {}; S.disciples = {}; S.prayers = {}; pending = {}; S.profile = defaultProfile(); loadLocal();
      Object.keys(prev.disciples || {}).forEach(function (k) { if (!S.disciples[k]) { S.disciples[k] = prev.disciples[k]; pending[dPath(k)] = { d: prev.disciples[k], v: ++pv }; } });
      Object.keys(prev.contacts || {}).forEach(function (k) { if (!S.contacts[k]) { S.contacts[k] = prev.contacts[k]; pending[cPath(k)] = { d: prev.contacts[k], v: ++pv }; } });
      Object.keys(prev.events || {}).forEach(function (k) { if (!S.events[k]) { S.events[k] = prev.events[k]; pending[ePath(k)] = { d: prev.events[k], v: ++pv }; } });
      Object.keys(prev.prayers || {}).forEach(function (k) { if (!S.prayers[k]) { S.prayers[k] = prev.prayers[k]; pending[prPath(k)] = { d: prev.prayers[k], v: ++pv }; } });
    }
    lsSet('shepherd:last-uid', id);
    DB = db; S.mode = 'cloud'; saveLocal(); subscribe(); flush();
  } else {
    if (!S.uid) S.uid = 'local';
    S.mode = 'local'; S.profileSeen = true; setSync(Object.keys(pending).length && S.uid !== 'local' ? 'offline' : 'local');
    checkAgree(); maybeTour();
  }
  checkLock(); render();
  if (WEB) { handleLaunch(); refreshPush(); schedNow(); if (WEB.newName && !S.profile.name) { S.profile.name = WEB.newName; saveProfile(); } }
}
boot();
